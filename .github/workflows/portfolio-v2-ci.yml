name: Portfolio v2 CI

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'infra/**'
      - '.github/workflows/portfolio-v2-ci.yml'
  push:
    branches:
      - feat/angular-fastapi-azure
    paths:
      - 'apps/**'
      - 'infra/**'
      - '.github/workflows/portfolio-v2-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    name: FastAPI · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: pytest

  frontend:
    name: Angular · test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build
